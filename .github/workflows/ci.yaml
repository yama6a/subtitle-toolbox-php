name: ci

on:
  pull_request:
    branches: [master]
    # labeled/unlabeled so the gate re-runs on a label change, not just on a push.
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-label:
    name: release label
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: yama6a/gha/.github/actions/release-label@v2

  php:
    uses: yama6a/gha/.github/workflows/php-ci.yaml@v2
    with:
      php-versions: '["8.3", "8.4", "8.5", "8.6"]'
      extensions: curl # the translation engines need it, so CurlHttpClientTest runs

  tesseract:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.5"
          coverage: none
          tools: composer
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-rus
      - run: composer install --no-progress --no-interaction
      - run: vendor/bin/phpunit --group tesseract --fail-on-skipped

  yaml:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: yama6a/gha/.github/actions/yaml-checks@v2
