name: ci

on:
  pull_request:
    branches: [master]
    # labeled/unlabeled so the gate re-runs on a label change, not just on a push.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-label:
    name: release label
    # a push to master carries no PR labels, so the gate runs on the PR only
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: yama6a/gha/.github/actions/release-label@v2

  php:
    uses: yama6a/gha/.github/workflows/php-ci.yaml@v2
    with:
      extensions: curl # the translate engines need it, so CurlHttpClientTest and the translate tests run

  phar:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The floor version, so the PHAR is known to run where the library does.
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.2"
          coverage: none
          tools: composer, box:4.7.0
      - run: .build/build-phar.sh 0.0.0-ci
      - run: .build/smoke-test.sh 0.0.0-ci tests/files subtitle-toolbox.phar php

  docker:
    uses: yama6a/gha/.github/workflows/docker-build-check.yaml@v2
    with:
      dockerfile: .build/Dockerfile
      build-args: |
        VERSION=0.0.0-ci
      smoke-test: .build/smoke-test.sh 0.0.0-ci files /usr/local/bin/subtitle-toolbox.phar docker run --rm -v "$PWD/tests/files:/work/files:ro" --entrypoint php "$IMAGE"

  docker-tesseract:
    uses: yama6a/gha/.github/workflows/docker-build-check.yaml@v2
    with:
      dockerfile: .build/tesseract.Dockerfile
      build-args: |
        VERSION=0.0.0-ci
      smoke-test: SMOKE_TESSERACT=1 .build/smoke-test.sh 0.0.0-ci files /usr/local/bin/subtitle-toolbox.phar docker run --rm -v "$PWD/tests/files:/work/files:ro" --entrypoint php "$IMAGE"

  # The php job has no Tesseract, so its tests skip there and run here.
  tesseract:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.5"
          coverage: none
          tools: composer
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-rus
      - run: composer install --no-progress --no-interaction
      - run: vendor/bin/phpunit --group tesseract --fail-on-skipped

  yaml:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: yama6a/gha/.github/actions/yaml-checks@v2

  renovate-config:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # a broken config silently stops every dependency update
      - uses: yama6a/gha/.github/actions/validate-renovate-config@v2
        with:
          config-file: renovate.json5
