# Releases on every merge to master: the PHAR and the image first, then the tag and the GitHub release
# with the PHAR attached, so a tag always has both artifacts. Packagist reads the tag through its GitHub webhook.
name: release

on:
  push:
    branches: [master]

# Serialised so two runs cannot tag the same version. A cancelled run here loses nothing:
# the next one recomputes the bump from every PR merged since the last release.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    uses: yama6a/gha/.github/workflows/php-release.yaml@v2
    permissions:
      contents: write # the reusable job requests it, although create-release false only reads
    with:
      create-release: false

  phar:
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          coverage: none
          tools: composer, box:4.7.0
      - run: .build/build-phar.sh "$VERSION"
        env:
          VERSION: ${{ needs.version.outputs.version }}
      - run: .build/smoke-test.sh "$VERSION" tests/files stbox.phar php
        env:
          VERSION: ${{ needs.version.outputs.version }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phar
          path: stbox.phar
          if-no-files-found: error

  image:
    needs: [version, phar]
    uses: yama6a/gha/.github/workflows/docker-build-release.yaml@v2
    permissions:
      contents: write # requested by the reusable job, which creates no release here
      packages: write # or the image push fails with permission_denied
      id-token: write # mints the OIDC token the attestation is signed with
      attestations: write # stores the attestation
    with:
      dockerfile: .build/Dockerfile
      version: ${{ needs.version.outputs.version }}
      build-args: |
        VERSION=${{ needs.version.outputs.version }}
      moving-tags: true
      create-release: false

  image-tesseract:
    needs: [version, phar]
    uses: yama6a/gha/.github/workflows/docker-build-release.yaml@v2
    permissions:
      contents: write # requested by the reusable job, which creates no release here
      packages: write # or the image push fails with permission_denied
      id-token: write # mints the OIDC token the attestation is signed with
      attestations: write # stores the attestation
    with:
      dockerfile: .build/tesseract.Dockerfile
      version: ${{ needs.version.outputs.version }}
      build-args: |
        VERSION=${{ needs.version.outputs.version }}
      moving-tags: true
      tag-suffix: -tesseract
      create-release: false

  release:
    needs: [version, phar, image, image-tesseract]
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: write # create the tag and the GitHub release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: phar
      - name: Tag and release with the PHAR
        uses: yama6a/gha/.github/actions/gh-release@v2
        with:
          tag: ${{ needs.version.outputs.tag }}
          target: ${{ github.sha }}
          generate-notes: "true"
          notes: "Images: `ghcr.io/${{ github.repository }}:${{ needs.version.outputs.version }}`, with Tesseract `ghcr.io/${{ github.repository }}:${{ needs.version.outputs.version }}-tesseract`"
          files: stbox.phar
